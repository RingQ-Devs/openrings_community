# OpenRings Community at https://openrings.org/community/
# Paste these two blocks inside the existing `server { ... }` block for openrings.org
# (the one with `listen 443 ssl`), then: sudo nginx -t && sudo systemctl reload nginx

# /community  ->  /community/
location = /community {
    return 301 /community/;
}

# Everything under /community/ goes to the forum (Node.js on 127.0.0.1:3000).
# Note: no path after the port in proxy_pass, so /community/... is passed through unchanged.
location /community/ {
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 1m;
}

# Search engines read robots.txt only at the domain root. Add this line to
# openrings.org's existing robots.txt:
#   Sitemap: https://openrings.org/community/sitemap.xml
