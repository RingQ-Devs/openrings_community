# OpenRings Community at https://openrings.org/community/ (Apache httpd)
# Needs: a2enmod proxy proxy_http headers   (Debian/Ubuntu)
# Paste inside the existing <VirtualHost *:443> for openrings.org, then reload Apache.

RedirectMatch 301 ^/community$ /community/
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"
ProxyPass        /community/ http://127.0.0.1:3000/community/
ProxyPassReverse /community/ http://127.0.0.1:3000/community/
